steps:
  - name: node:20
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npm install --no-save --cpu=x64 --os=linux --libc=glibc @next/swc-linux-x64-gnu@16.1.6
  - name: node:20
    entrypoint: npm
    args: [run, build]
    env:
      - NEXT_PUBLIC_API_URL=https://api.devper.app
  - name: node:20
    entrypoint: npx
    args:
      - firebase-tools
      - deploy
      - --only
      - hosting:devper-alert
      - --project
      - devperpos
      - --non-interactive
options:
  logging: CLOUD_LOGGING_ONLY
