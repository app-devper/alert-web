name: check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: https://api.devper.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
